server {
    listen 8080;
    server_tokens off; # 1. Tắt hiển thị version Nginx

    # 2. Cấu hình bảo mật (Security Headers)
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self';";

    root /usr/share/nginx/html;
    index index.html;

    # 3. Cấu hình Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml client/svg+xml image/x-icon;
    # Nếu bạn đã có file .gz từ webpack, hãy bật tính năng này:
    # gzip_static on;

    # Cấu hình riêng cho robots.txt và favicon
    location = /robots.txt {
        root /usr/share/nginx/html;
        allow all;
        log_not_found off;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;

        # 4. Cache cho các file tĩnh (1 tuần)
        location ~* \.(?:ico|css|js|gif|jpe?g|png|woff2?|eot|ttf|svg|map)$ {
            expires 7d;
            add_header Cache-Control "public, no-transform";
            access_log off;
        }
    }

    # Không cache file index.html để đảm bảo user luôn nhận bản cập nhật mới nhất
    location = /index.html {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
    }
}
