worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log /dev/stdout;
    server_tokens off;
    sendfile on;
    keepalive_timeout 65;

    # All writes stay in /tmp; the root filesystem can be read-only.
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    # The application builder does not execute custom-webpack.config.js.
    # No dependency on pre-generated .gz/.br or optional compression modules.

    # Server-level headers also apply to static files and error responses.
    # Only Angular hash-named build files get immutable caching.
    map "$status:$uri" $app_cache_control {
        default "no-cache";
        "~*^(?:200|304):/(?:main|polyfills|styles|chunk)-[a-z0-9_-]{8,}\.(?:js|css)$" "public, max-age=31536000, immutable";
        ~^200:/healthz$ "no-store";
    }

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control $app_cache_control always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        location = /healthz {
            access_log off;
            default_type text/plain;
            return 200 "ok\n";
        }

        location = /index.html {
            try_files $uri =404;
        }

        # Keep missing API requests out of the SPA HTML fallback.
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location ~ /\. { return 404; }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location ~* \.(?:js|mjs|css|map|json|ico|png|jpe?g|gif|svg|webp|avif|woff2?|ttf|eot|txt|xml|webmanifest)$ {
            try_files $uri =404;
        }

        # Direct navigation/refresh on Angular routes returns the SPA entry point.
        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
